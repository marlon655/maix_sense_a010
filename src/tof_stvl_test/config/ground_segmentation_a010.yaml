ground_segmentation:
  ros__parameters:
    # A entrada do segmentador ja foi transformada para base_footprint pelo
    # tof_cloud_preprocessor.
    robot_frame: base_footprint
    use_imu_orientation: false
    transform_tolerance: 0.10

    # Como a nuvem de entrada ja esta em base_footprint, o plano nominal do
    # piso esta em Z=0. Usar -0.22 aqui colocaria a semente abaixo do piso.
    lidar_to_ground: 0.0

    # Regiao inicial de interesse do A010 no frame base_footprint.
    minX: 0.0
    maxX: 2.80
    minY: -2.0
    maxY: 2.0
    minZ: -0.10
    maxZ: 1.50

    # A nuvem do A010 ja e pequena e densa; inicialmente nao reduzimos pontos.
    downsample: false
    downsample_resolution: 0.03

    # Parametros iniciais para o alcance curto e a densidade do ToF. Eles serao
    # calibrados observando ground_points e obstacle_points_raw ao vivo.
    cellSizeX: 0.20
    cellSizeY: 0.20
    cellSizeZ: 1.00
    cellSizeZPhase2: 0.10
    slopeThresholdDegrees: 20.0
    groundInlierThreshold: 0.03
    centroidSearchRadius: 1.00
    maxGroundHeightDeviation: 0.08

    show_benchmark: false
