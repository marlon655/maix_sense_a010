local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: base_footprint
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.20
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.26, -0.25], [0.26, 0.25], [-0.26, 0.25], [-0.26, -0.25]]"
      plugins: ["stvl_layer", "inflation_layer"]
      always_send_full_costmap: true

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 1.0
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: false
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: true
        transform_tolerance: 0.20
        mapping_mode: false
        observation_sources: tof_obstacles

        tof_obstacles:
          data_type: PointCloud2
          topic: /ground_segmentation/obstacle_points
          marking: true
          clearing: false
          obstacle_range: 1.20
          min_obstacle_height: 0.01
          max_obstacle_height: 1.00
          expected_update_rate: 0.0
          observation_persistence: 0.0
          filter: "passthrough"
          voxel_min_points: 0
          clear_after_reading: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.30
        cost_scaling_factor: 5.0
