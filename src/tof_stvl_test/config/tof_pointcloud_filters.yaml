tof_pointcloud_preprocessor:
  ros__parameters:
    # Fluxo do pre-processamento:
    # /cloud
    #   -> distancia no frame do ToF
    #   -> transformacao para base_footprint
    #   -> altura e lateral
    #   -> vizinhos no mesmo frame
    #   -> transformacao para odom e persistencia entre frames
    #   -> aplicacao da mascara nos pontos atuais em base_footprint
    #   -> transformacao de volta para o frame tof
    #   -> /ground_segmentation/obstacle_points

    # Topico PointCloud2 recebido diretamente do driver do A010.
    input_topic: /cloud

    # Topico final que contem somente os pontos aprovados por todos os filtros.
    # Esta e a unica nuvem desta secao destinada ao STVL/costmap.
    output_topic: /ground_segmentation/obstacle_points

    # Frame no qual os filtros de altura, lateral, espacial e temporal operam.
    # Em base_footprint, X aponta para frente, Y para os lados e Z para cima.
    target_frame: base_footprint

    # Frame usado na nuvem final. A saida volta para tof para manter a origem
    # dos raios correta para a observacao e a limpeza por frustum do STVL.
    output_frame: tof

    # Tempo maximo, em segundos, que o no espera pela transformacao TF de cada
    # nuvem. Se a TF nao estiver disponivel nesse intervalo, o frame e ignorado.
    transform_timeout: 0.10

    # Limites de distancia euclidiana, em metros, medidos a partir da lente.
    # Pontos muito proximos ou alem do alcance configurado sao descartados.
    # Por ser euclidiana, a regiao resultante e um setor esferico, nao uma caixa.
    distance_min: 0.20
    distance_max: 2.0

    # Alturas minima e maxima aceitas, em metros, no frame base_footprint.
    # height_min remove piso e retornos baixos; height_max remove pontos altos.
    height_min: 0.04
    height_max: 1.20

    # Limites laterais, em metros, no eixo Y de base_footprint.
    # Valores negativos ficam de um lado do robo e positivos do outro.
    # A faixa atual aceita 1,10 m para cada lado (2,20 m de largura total).
    lateral_min: -1.10
    lateral_max: 1.10

    # Filtro espacial executado dentro de cada frame.
    # radius_search e o raio, em metros, usado para procurar pontos vizinhos.
    # min_neighbors e a quantidade minima de vizinhos, sem contar o proprio
    # ponto. Pontos isolados que nao atingem essa quantidade sao removidos.
    radius_search: 0.05
    min_neighbors: 3

    # Filtro temporal executado depois do filtro espacial.
    # temporal_required_frames define em quantos frames consecutivos um ponto
    # precisa encontrar correspondencia para ser aprovado. Com valor 2, o ponto
    # atual precisa corresponder a um ponto do frame anterior.
    temporal_required_frames: 2

    # Distancia maxima, em metros, entre o ponto atual e o ponto correspondente
    # no historico. Como a comparacao ocorre em odom, o raio de 0,05 m representa
    # principalmente ruido do sensor, erro de odometria e movimento do objeto.
    temporal_match_radius: 0.05

    # Frame fixo usado somente para comparar e armazenar o historico temporal.
    # Os pontos aprovados continuam em base_footprint e saem no frame tof.
    temporal_reference_frame: odom

    # Limpa o historico quando o intervalo entre nuvens ultrapassa este valor,
    # em segundos, evitando comparar amostras temporalmente desconectadas.
    temporal_max_frame_gap: 0.50

    # Em uma falha da TF base_footprint -> odom, nao reutiliza o historico
    # anterior quando a transformacao voltar a ficar disponivel.
    temporal_clear_history_on_tf_failure: true

    # Saltos maiores que estes limites entre poses consecutivas sao tratados
    # como reset/descontinuidade da odometria. Unidades: metros e radianos.
    temporal_max_translation_jump: 1.0
    temporal_max_rotation_jump: 1.5708

    # Habilita as nuvens intermediarias de debug. Elas permitem visualizar no
    # RViz a saida de cada etapa, mas nao sao entradas do STVL:
    # /tof_filters/distance, /height, /lateral e /spatial.
    publish_intermediate_clouds: true

    # Publica /tof_filters/filter_bounds como Marker no base_footprint.
    # A caixa wireframe representa de forma pratica os limites configurados;
    # o corte real de distance_max continua sendo euclidiano.
    publish_filter_bounds: true

    # Publica /tof_filters/projected_wall somente para visualizacao no RViz.
    # Raios reais que nao viraram obstaculo sao projetados no limite frontal;
    # raios aprovados ficam ausentes e formam silhuetas na parede de debug.
    publish_projected_wall: true

    # Valor minimo da componente frontal X do raio usado na projecao. Evita
    # divisao por zero e impede projetar raios paralelos ou voltados para tras.
    projected_wall_epsilon: 0.001

# Configuracao central temporaria do costmap durante os testes do A010.
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 10.0
      publish_frequency: 5.0
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.01
      footprint: "[[0.26, -0.25], [0.26, 0.25], [-0.26, 0.25], [-0.26, -0.25]]"
      plugins: ["stvl_layer", "inflation_layer"]
      always_send_full_costmap: true

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 0.5
        decay_model: 0
        voxel_size: 0.02
        track_unknown_space: false
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.5
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: pointcloud

        pointcloud:
          topic: /ground_segmentation/obstacle_points
          data_type: PointCloud2
          marking: true
          clearing: false
          observation_persistence: 0.0

          # O STVL 2.5.5 usa obstacle_range. A distancia minima e
          # aplicada por distance_min no pre-processador acima.
          obstacle_range: 2.0
          min_obstacle_height: 0.04
          max_obstacle_height: 1.20
          expected_update_rate: 0.0
          inf_is_valid: false
          filter: "passthrough"
          voxel_min_points: 0
          clear_after_reading: true

          # Alcance do frustum de limpeza do A010. O STVL nao usa os
          # parametros raytrace_min_range e raytrace_max_range.
          min_z: 0.20
          max_z: 1.20
          vertical_fov_angle: 1.047
          horizontal_fov_angle: 1.22
          decay_acceleration: 10.0
          model_type: 0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.03
        cost_scaling_factor: 5.0
