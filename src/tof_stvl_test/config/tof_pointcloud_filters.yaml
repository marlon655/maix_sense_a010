tof_pointcloud_preprocessor:
  ros__parameters:
    # Topicos da nuvem bruta e da nuvem aprovada para o costmap.
    input_topic: /cloud
    output_topic: /ground_segmentation/obstacle_points

    # A nuvem e transformada para este frame antes do filtro de altura.
    target_frame: base_footprint
    # A saida volta ao frame optico para a limpeza por frustum do STVL.
    output_frame: tof
    transform_timeout: 0.10

    # Distancia euclidiana medida a partir da lente do A010.
    distance_min: 0.20
    distance_max: 1.20

    # Segmentacao do piso por altura no frame base_footprint.
    height_min: 0.05
    height_max: 0.60

    # Remove pontos sem ao menos 3 vizinhos em um raio de 5 cm.
    radius_search: 0.05
    min_neighbors: 2

    # Exige correspondencia espacial em 3 frames consecutivos.
    temporal_required_frames: 2
    temporal_match_radius: 0.7

    # Publica /tof_filters/distance, /height e /spatial para debug.
    publish_intermediate_clouds: true

# Configuracao central temporaria do costmap durante os testes do A010.
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 3.0
      publish_frequency: 1.0
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[0.26, -0.25], [0.26, 0.25], [-0.26, 0.25], [-0.26, -0.25]]"
      plugins: ["stvl_layer", "inflation_layer"]
      always_send_full_costmap: true

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 0.5
        decay_model: 0
        voxel_size: 0.10
        track_unknown_space: false
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.5
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: pointcloud

        pointcloud:
          topic: /ground_segmentation/obstacle_points
          data_type: PointCloud2
          marking: true
          clearing: false
          observation_persistence: 0.0

          # O STVL 2.5.5 usa obstacle_range. A distancia minima e
          # aplicada por distance_min no pre-processador acima.
          obstacle_range: 1.20
          min_obstacle_height: 0.05
          max_obstacle_height: 0.60
          expected_update_rate: 0.0
          inf_is_valid: false
          filter: "passthrough"
          voxel_min_points: 0
          clear_after_reading: true

          # Alcance do frustum de limpeza do A010. O STVL nao usa os
          # parametros raytrace_min_range e raytrace_max_range.
          min_z: 0.20
          max_z: 1.20
          vertical_fov_angle: 1.047
          horizontal_fov_angle: 1.22
          decay_acceleration: 10.0
          model_type: 0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.30
        cost_scaling_factor: 5.0
