tof_obstacle_postprocessor:
  ros__parameters:
    input_topic: /ground_segmentation/obstacle_points_raw
    output_topic: /ground_segmentation/obstacle_points
    target_frame: base_footprint
    output_frame: tof
    transform_timeout: 0.10

    # Limites aplicados somente aos pontos classificados como obstaculo.
    # Os limites laterais sao coordenadas assinadas no eixo Y.
    distance_max: 1.0
    height_min: 0.04
    height_max: 1.0
    lateral_min: -0.20
    lateral_max: 0.20

    # Remocao de pontos isolados dentro de cada frame.
    radius_search: 0.05
    min_neighbors: 3

    # O ponto deve aparecer no frame atual e no anterior.
    temporal_required_frames: 2
    temporal_match_radius: 0.05

    publish_intermediate_clouds: true
    publish_filter_bounds: true
