# REFERENCIA: mescle esta fonte no stvl_layer do local_costmap oficial.
# Nao carregue este arquivo pelo tof_robot_bringup e nao crie outro costmap.
# O nome da camada pode ser diferente no robo; preserve a configuracao oficial.
stvl_layer:
  observation_sources: pointcloud

  pointcloud:
    topic: /ground_segmentation/obstacle_points
    data_type: PointCloud2
    marking: true
    clearing: false
    observation_persistence: 0.0
    obstacle_range: 2.0
    min_obstacle_height: 0.04
    max_obstacle_height: 1.20
    expected_update_rate: 0.0
    inf_is_valid: false
    clear_after_reading: true
    sensor_frame: tof

# Nunca adicione /tof_filters/* a observation_sources. Esses topicos sao
# exclusivamente de diagnostico e nao podem marcar o costmap oficial.
